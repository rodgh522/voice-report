[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-report"
version = "0.1.0"
description = "Convert voice recordings into structured meeting reports"
requires-python = ">=3.10"
dependencies = [
    "whisperx>=3.1.0",
    "google-genai>=1.0.0",
    "typer[all]>=0.12.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[project.scripts]
voice-report = "voice_report.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_report"]

[tool.ruff]
target-version = "py310"
line-length = 100
